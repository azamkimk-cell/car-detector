<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>اختبار كشف السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#setup{
    min-height:100vh;
    background:#111;
    padding:20px;
}

.card{
    max-width:550px;
    margin:40px auto;
    background:#222;
    padding:20px;
    border-radius:16px;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin:20px 0 8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    font-size:20px;
    text-align:center;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 16px;
    font-size:17px;
    font-weight:bold;
}

.save{
    width:100%;
    margin-top:20px;
    background:#1683ff;
    color:white;
}

.info{
    margin-top:18px;
    padding:13px;
    background:#333;
    border-radius:10px;
    line-height:1.7;
}

#camera{
    display:none;
    position:absolute;
    inset:0;
    background:#000;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    background:rgba(0,0,0,.75);
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

#target{
    font-weight:bold;
}

.edit{
    background:#1683ff;
    color:white;
}

#status{
    position:absolute;
    top:65px;
    right:10px;
    z-index:20;
    background:rgba(0,0,0,.8);
    padding:9px 13px;
    border-radius:20px;
}

#result{
    position:absolute;
    bottom:15px;
    left:10px;
    right:10px;
    z-index:20;
    background:rgba(0,0,0,.8);
    padding:14px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.green{
    color:#00ff66;
}

.yellow{
    color:#ffd700;
}
</style>
</head>

<body>

<!-- صفحة إدخال الرقم -->

<div id="setup">

    <div class="card">

        <h2>🚨 السيارة المطلوبة</h2>

        <label>
            🔢 رقم السيارة المطلوبة
        </label>

        <input
            id="plateInput"
            type="text"
            inputmode="numeric"
            placeholder="مثال: 1234"
        >

        <button
            class="save"
            onclick="saveAndStart()"
        >
            💾 حفظ الرقم وبدء الكاميرا
        </button>

        <div class="info">

            اكتب رقم اللوحة المطلوبة ثم اضغط حفظ.

            <br><br>

            هذه النسخة مخصصة أولًا لاختبار
            <b>استقرار الكاميرا وكشف السيارات</b>.

            <br><br>

            بعد نجاح الاختبار سنضيف قراءة اللوحة
            والمطابقة والإنذار.

        </div>

    </div>

</div>


<!-- صفحة الكاميرا -->

<div id="camera">

    <video
        id="video"
        autoplay
        muted
        playsinline
    ></video>

    <canvas id="canvas"></canvas>

    <div class="top">

        <div id="target">
            🎯 الرقم المطلوب: -
        </div>

        <button
            class="edit"
            onclick="showSetup()"
        >
            ⚙️ تعديل
        </button>

    </div>

    <div id="status">
        جاري التحميل...
    </div>

    <div id="result">
        انتظار الكاميرا...
    </div>

</div>


<script>

let model=null;

let running=false;

let detecting=false;

const video=
document.getElementById("video");

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const setup=
document.getElementById("setup");

const camera=
document.getElementById("camera");

const status=
document.getElementById("status");

const result=
document.getElementById("result");

const target=
document.getElementById("target");


/* =========================
   حفظ الرقم
========================= */

function saveAndStart(){

    const plate=
    document
    .getElementById("plateInput")
    .value
    .trim();

    if(!plate){

        alert(
            "أدخل رقم السيارة أولًا"
        );

        return;
    }

    localStorage.setItem(
        "wantedPlate",
        plate
    );

    target.innerText=
    "🎯 الرقم المطلوب: "+plate;

    setup.style.display="none";

    camera.style.display="block";

    startCamera();
}


/* =========================
   تحميل الرقم
========================= */

function loadPlate(){

    const plate=
    localStorage.getItem(
        "wantedPlate"
    );

    if(plate){

        document
        .getElementById("plateInput")
        .value=plate;

        target.innerText=
        "🎯 الرقم المطلوب: "+plate;
    }
}


/* =========================
   الكاميرا
========================= */

async function startCamera(){

    if(running)
        return;

    try{

        status.innerText=
        "جاري تشغيل الكاميرا...";

        const stream=
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false
        });

        video.srcObject=
        stream;

        running=true;

        status.innerText=
        "🟢 الكاميرا تعمل";

        video.onloadedmetadata=
        async function(){

            canvas.width=
            video.videoWidth;

            canvas.height=
            video.videoHeight;

            if(!model){

                status.innerText=
                "جاري تحميل كاشف السيارات...";

                try{

                    await tf.ready();

                    model=
                    await cocoSsd.load();

                }catch(error){

                    console.error(error);

                    status.innerText=
                    "❌ فشل تحميل كاشف السيارات";

                    return;
                }
            }

            status.innerText=
            "🟢 النظام يعمل";

            detect();
        };

    }catch(error){

        console.error(error);

        status.innerText=
        "❌ تعذر تشغيل الكاميرا";

        result.innerText=
        error.message;
    }
}


/* =========================
   كشف السيارات
========================= */

async function detect(){

    if(!running)
        return;

    if(detecting){

        setTimeout(
            detect,
            150
        );

        return;
    }

    detecting=true;

    try{

        const predictions=
        await model.detect(
            video,
            20,
            0.30
        );

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const vehicles=
        predictions.filter(
            p=>
            (
                p.class==="car" ||
                p.class==="truck" ||
                p.class==="bus"
            )
            &&
            p.score>=0.30
        );

        vehicles.forEach(
            p=>{

                const[
                    x,y,w,h
                ]=
                p.bbox;

                ctx.strokeStyle=
                "#00ff66";

                ctx.lineWidth=5;

                ctx.strokeRect(
                    x,y,w,h
                );

                ctx.fillStyle=
                "#00ff66";

                ctx.font=
                "bold 22px Arial";

                ctx.fillText(
                    p.class+
                    " "+
                    Math.round(
                        p.score*100
                    )+
                    "%",
                    x,
                    Math.max(
                        25,
                        y-8
                    )
                );
            }
        );

        result.innerHTML=
        '<span class="green">🚗 المركبات المكتشفة: '+
        vehicles.length+
        '</span>';

    }catch(error){

        console.error(
            "Detection error:",
            error
        );

        /*
        لا نوقف الكاميرا عند حدوث
        خطأ في دورة واحدة.
        */

    }

    detecting=false;

    if(running){

        setTimeout(
            detect,
            150
        );
    }
}


/* =========================
   العودة للمواصفات
========================= */

function showSetup(){

    running=false;

    detecting=false;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        video.srcObject=null;
    }

    camera.style.display="none";

    setup.style.display="block";

    loadPlate();
}


/* =========================
   البداية
========================= */

loadPlate();

</script>

</body>
</html>
