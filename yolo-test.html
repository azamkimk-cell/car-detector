<script>

/* ==================================================
   المتغيرات
================================================== */

let carModel = null;
let plateModel = null;

let running = false;
let detecting = false;
let ocrBusy = false;

let targetData = null;

let selectedCar = null;
let lockedVehicle = null;
let lastVehicleCenter = null;

let lastPlateScan = 0;
let lastAlarm = 0;
let lastMatch = false;

let audioContext = null;


/* ==================================================
   رابط نموذج Hugging Face
================================================== */

const PLATE_MODEL_URL =
"https://huggingface.co/Mohammed1999222/car-detector-model/resolve/main/license-plate-finetune-v1n.onnx";


/* ==================================================
   عناصر الصفحة
================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const zoomCanvas =
document.getElementById("zoomCanvas");

const zoomCtx =
zoomCanvas.getContext("2d");

const setupPage =
document.getElementById("setupPage");

const cameraPage =
document.getElementById("cameraPage");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const summary =
document.getElementById("summary");

const zoomBox =
document.getElementById("zoomBox");


/* ==================================================
   حفظ الهدف
================================================== */

function saveAndStart(){

    const data = {

        plate:
        document
        .getElementById("plateInput")
        .value
        .trim(),

        type:
        document
        .getElementById("typeInput")
        .value

    };


    if(!data.plate && !data.type){

        alert(
            "أدخل رقم اللوحة أو نوع المركبة"
        );

        return;
    }


    localStorage.setItem(
        "wantedVehicleTest",
        JSON.stringify(data)
    );


    targetData = data;

    updateSummary();


    setupPage.style.display =
    "none";

    cameraPage.style.display =
    "block";


    startCamera();
}


/* ==================================================
   تحميل الهدف
================================================== */

function loadTarget(){

    const saved =
    localStorage.getItem(
        "wantedVehicleTest"
    );


    if(!saved)
        return null;


    try{

        targetData =
        JSON.parse(saved);


        document
        .getElementById("plateInput")
        .value =
        targetData.plate || "";


        document
        .getElementById("typeInput")
        .value =
        targetData.type || "";


        updateSummary();


        return targetData;

    }catch(error){

        console.error(error);

        return null;
    }
}


/* ==================================================
   عرض الهدف
================================================== */

function updateSummary(){

    if(!targetData){

        summary.innerText =
        "🎯 لا توجد مواصفات";

        return;
    }


    let text =
    "🎯 المطلوب: ";


    if(targetData.plate){

        text +=
        "لوحة " +
        targetData.plate;
    }


    if(
        targetData.plate &&
        targetData.type
    ){

        text +=
        " | ";
    }


    if(targetData.type){

        const types = {

            car:"سيارة",

            truck:"شاحنة",

            bus:"حافلة"

        };


        text +=
        types[targetData.type] ||
        targetData.type;
    }


    summary.innerText =
    text;
}


/* ==================================================
   الصوت
================================================== */

function initAudio(){

    try{

        if(!audioContext){

            audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();
        }

    }catch(error){

        console.error(error);
    }
}


/* ==================================================
   الإنذار
================================================== */

function alarm(){

    const now =
    Date.now();


    if(
        now-lastAlarm <
        4000
    )
        return;


    lastAlarm =
    now;


    try{

        initAudio();


        if(!audioContext)
            return;


        const oscillator =
        audioContext.createOscillator();


        const gain =
        audioContext.createGain();


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.type =
        "square";


        oscillator.frequency.value =
        1000;


        gain.gain.value =
        .35;


        oscillator.start();


        setTimeout(
            ()=>{
                oscillator.frequency.value =
                700;
            },
            180
        );


        setTimeout(
            ()=>{
                oscillator.stop();
            },
            700
        );

    }catch(error){

        console.error(error);
    }
}


/* ==================================================
   تحميل النماذج
================================================== */

async function loadModels(){

    try{

        status.innerText =
        "🧠 جاري تحميل كاشف المركبات...";


        await tf.ready();


        carModel =
        await cocoSsd.load();


        status.innerText =
        "🧠 جاري تحميل نموذج اللوحات من Hugging Face...";


        /*
        تحميل نموذج YOLO
        */

        plateModel =
        await ort.InferenceSession.create(

            PLATE_MODEL_URL,

            {

                executionProviders:[
                    "wasm"
                ],

                graphOptimizationLevel:
                "all"

            }
        );


        console.log(
            "================================"
        );

        console.log(
            "PLATE MODEL LOADED"
        );

        console.log(
            "INPUTS:",
            plateModel.inputNames
        );

        console.log(
            "OUTPUTS:",
            plateModel.outputNames
        );

        console.log(
            "INPUT METADATA:",
            plateModel.inputMetadata
        );

        console.log(
            "OUTPUT METADATA:",
            plateModel.outputMetadata
        );

        console.log(
            "================================"
        );


        status.innerText =
        "✅ تم تحميل النموذجين بنجاح";


    }catch(error){

        console.error(
            "MODEL ERROR:",
            error
        );


        status.innerText =
        "❌ فشل تحميل نموذج اللوحة";


        result.innerHTML =
        "❌ خطأ تحميل النموذج<br><br>" +
        error.message;
    }
}


/* ==================================================
   تشغيل الكاميرا
================================================== */

async function startCamera(){

    if(running)
        return;


    if(!carModel){

        alert(
            "النماذج لم تكتمل بعد. انتظر قليلًا."
        );

        return;
    }


    try{

        initAudio();


        status.innerText =
        "📷 جاري تشغيل الكاميرا...";


        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        running = true;


        status.innerText =
        "🟢 الكاميرا تعمل";


        video.onloadedmetadata =
        ()=>{

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;


            detectCars();
        };


    }catch(error){

        console.error(error);


        result.innerHTML =
        "❌ تعذر تشغيل الكاميرا<br>" +
        error.message;
    }
}


/* ==================================================
   إيقاف
================================================== */

function stopCamera(){

    running = false;

    detecting = false;

    ocrBusy = false;

    selectedCar = null;

    lockedVehicle = null;

    lastVehicleCenter = null;


    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(
            track=>{
                track.stop();
            }
        );


        video.srcObject = null;
    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    zoomBox.style.display =
    "none";
}


/* ==================================================
   كشف المركبات
================================================== */

async function detectCars(){

    if(!running)
        return;


    if(detecting){

        setTimeout(
            detectCars,
            150
        );

        return;
    }


    detecting = true;


    try{

        const predictions =
        await carModel.detect(
            video,
            20,
            .25
        );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const vehicles =
        predictions.filter(
            item=>
            (
                item.class === "car" ||
                item.class === "truck" ||
                item.class === "bus"
            )
            &&
            item.score >= .25
        );


        selectedCar =
        chooseBestVehicle(
            vehicles
        );


        vehicles.forEach(
            vehicle=>{

                const[
                    x,
                    y,
                    w,
                    h
                ] =
                vehicle.bbox;


                const selected =
                vehicle ===
                selectedCar;


                ctx.strokeStyle =
                selected
                ? "#00ff66"
                : "#ffd700";


                ctx.lineWidth =
                selected
                ? 6
                : 3;


                ctx.strokeRect(
                    x,
                    y,
                    w,
                    h
                );


                ctx.fillStyle =
                selected
                ? "#00ff66"
                : "#ffd700";


                ctx.font =
                "bold 20px Arial";


                ctx.fillText(
                    selected
                    ? "🎯 مرشح"
                    : vehicle.class,
                    x,
                    Math.max(
                        25,
                        y-8
                    )
                );

            }
        );


        if(selectedCar){

            const[
                x,
                y,
                w,
                h
            ] =
            selectedCar.bbox;


            createZoom(
                x,
                y,
                w,
                h
            );


            /*
            فحص اللوحة كل 2.5 ثانية
            */

            if(
                plateModel &&
                !ocrBusy &&
                Date.now() -
                lastPlateScan >
                2500
            ){

                lastPlateScan =
                Date.now();


                inspectVehicle(
                    selectedCar
                );
            }


        }else{

            zoomBox.style.display =
            "none";


            result.innerHTML =
            '<span class="yellow">' +
            '🔎 البحث عن المركبات...' +
            '</span>';
        }


    }catch(error){

        console.error(
            "Vehicle detection error:",
            error
        );
    }


    detecting = false;


    if(running){

        setTimeout(
            detectCars,
            180
        );
    }
}


/* ==================================================
   فحص المركبة واللوحة
================================================== */

async function inspectVehicle(vehicle){

    if(!vehicle)
        return;


    if(!plateModel){

        result.innerHTML =
        "⚠️ نموذج اللوحة غير محمل";

        return;
    }


    if(ocrBusy)
        return;


    ocrBusy = true;


    try{

        result.innerHTML =
        "🔎 جاري تحديد لوحة المركبة...";


        const[
            x,
            y,
            w,
            h
        ] =
        vehicle.bbox;


        /*
        إنشاء صورة المركبة
        */

        const source =
        document.createElement(
            "canvas"
        );


        const sctx =
        source.getContext("2d");


        const padding =
        .10;


        const sx =
        Math.max(
            0,
            x - w * padding
        );


        const sy =
        Math.max(
            0,
            y - h * padding
        );


        const sw =
        Math.min(
            video.videoWidth - sx,
            w * (1 + padding * 2)
        );


        const sh =
        Math.min(
            video.videoHeight - sy,
            h * (1 + padding * 2)
        );


        /*
        حجم إدخال YOLO
        */

        const inputSize =
        640;


        source.width =
        inputSize;

        source.height =
        inputSize;


        /*
        خلفية سوداء
        */

        sctx.fillStyle =
        "#000";


        sctx.fillRect(
            0,
            0,
            inputSize,
            inputSize
        );


        /*
        الحفاظ على النسبة
        */

        const scale =
        Math.min(
            inputSize / sw,
            inputSize / sh
        );


        const nw =
        sw * scale;


        const nh =
        sh * scale;


        const dx =
        (inputSize - nw) / 2;


        const dy =
        (inputSize - nh) / 2;


        sctx.drawImage(
            video,
            sx,
            sy,
            sw,
            sh,
            dx,
            dy,
            nw,
            nh
        );


        /*
        RGB / CHW
        */

        const imageData =
        sctx.getImageData(
            0,
            0,
            inputSize,
            inputSize
        );


        const plane =
        inputSize *
        inputSize;


        const data =
        new Float32Array(
            3 *
            plane
        );


        let r = 0;

        let g = plane;

        let b = plane * 2;


        for(
            let i=0;
            i<imageData.data.length;
            i+=4
        ){

            data[r++] =
            imageData.data[i] /
            255;


            data[g++] =
            imageData.data[i+1] /
            255;


            data[b++] =
            imageData.data[i+2] /
            255;
        }


        const tensor =
        new ort.Tensor(
            "float32",
            data,
            [
                1,
                3,
                inputSize,
                inputSize
            ]
        );


        /*
        تشغيل نموذج Hugging Face
        */

        const inputName =
        plateModel.inputNames[0];


        const outputs =
        await plateModel.run({

            [inputName]:
            tensor

        });


        const outputName =
        plateModel.outputNames[0];


        const output =
        outputs[
            outputName
        ];


        if(
            !output ||
            !output.data
        ){

            result.innerHTML =
            "🟨 لم يتم العثور على لوحة";

            return;
        }


        console.log(
            "YOLO OUTPUT DIMS:",
            output.dims
        );


        console.log(
            "YOLO OUTPUT DATA:",
            output.data
        );


        /*
        فك نتيجة YOLO
        */

        const plate =
        decodePlateDetection(
            output,
            sw,
            sh,
            dx,
            dy,
            nw,
            nh,
            sx,
            sy
        );


        if(!plate){

            result.innerHTML =
            '<span class="yellow">' +
            '🟨 المركبة موجودة — لم يتم تحديد اللوحة' +
            '</span>';

            return;
        }


        /*
        رسم مربع اللوحة
        */

        ctx.strokeStyle =
        "#00ff66";


        ctx.lineWidth =
        5;


        ctx.strokeRect(
            plate.x,
            plate.y,
            plate.w,
            plate.h
        );


        /*
        قراءة اللوحة
        */

        result.innerHTML =
        "🔤 جاري قراءة رقم اللوحة...";


        const text =
        await readPlateOCR(
            plate.x,
            plate.y,
            plate.w,
            plate.h
        );


        const detectedPlate =
        normalize(text);


        const targetPlate =
        normalize(
            targetData?.plate || ""
        );


        console.log(
            "النص الأصلي:",
            text
        );


        console.log(
            "الرقم بعد التنظيف:",
            detectedPlate
        );


        /*
        مقارنة الرقم
        */

        if(
            targetPlate &&
            detectedPlate.includes(
                targetPlate
            )
        ){

            lastMatch = true;


            result.innerHTML =
            '<span class="red">' +
            '🚨🚨 السيارة المطلوبة! 🚨🚨' +
            '</span><br>' +
            'اللوحة: ' +
            detectedPlate;


            alarm();


        }else{

            lastMatch = false;


            result.innerHTML =
            '<span class="yellow">' +
            '🟨 مركبة مكتشفة' +
            '</span><br>' +
            'اللوحة المقروءة: ' +
            (
                detectedPlate ||
                "غير واضحة"
            );
        }


    }catch(error){

        console.error(
            "inspectVehicle error:",
            error
        );


        result.innerHTML =
        '<span class="yellow">' +
        '⚠️ تعذر فحص اللوحة' +
        '</span><br>' +
        error.message;


    }finally{

        ocrBusy = false;
    }
}


/* ==================================================
   فك نتيجة YOLO
================================================== */

function decodePlateDetection(
    output,
    cropW,
    cropH,
    dx,
    dy,
    nw,
    nh,
    sourceX,
    sourceY
){

    const dims =
    output.dims || [];


    const values =
    output.data;


    if(
        dims.length !== 3
    )
        return null;


    let count;

    let channels;

    let transposed =
    false;


    /*
    [1,5,N]
    */

    if(
        dims[1] <= 10
    ){

        channels =
        dims[1];

        count =
        dims[2];

    }

    /*
    [1,N,5]
    */

    else{

        count =
        dims[1];

        channels =
        dims[2];

        transposed =
        true;
    }


    if(
        channels < 5
    )
        return null;


    let best =
    null;


    for(
        let i=0;
        i<count;
        i++
    ){

        let cx;
        let cy;
        let bw;
        let bh;
        let score;


        if(!transposed){

            cx =
            values[i];


            cy =
            values[
                count+i
            ];


            bw =
            values[
                2*count+i
            ];


            bh =
            values[
                3*count+i
            ];


            score =
            values[
                4*count+i
            ];

        }else{

            const base =
            i*channels;


            cx =
            values[base];


            cy =
            values[
                base+1
            ];


            bw =
            values[
                base+2
            ];


            bh =
            values[
                base+3
            ];


            score =
            values[
                base+4
            ];
        }


        /*
        بعض نماذج YOLO قد تعطي
        logits بدل probability
        */

        if(
            score < 0 ||
            score > 1
        ){

            score =
            sigmoid(score);
        }


        if(
            score < .20
        )
            continue;


        /*
        تحويل الإحداثيات
        */

        const bx =
        (cx-dx) /
        nw;


        const by =
        (cy-dy) /
        nh;


        const bwNorm =
        bw / nw;


        const bhNorm =
        bh / nh;


        if(
            bx < -.2 ||
            by < -.2 ||
            bx > 1.2 ||
            by > 1.2
        )
            continue;


        const px =
        Math.max(
            0,
            Math.round(
                (bx-bwNorm/2) *
                cropW
            )
        );


        const py =
        Math.max(
            0,
            Math.round(
                (by-bhNorm/2) *
                cropH
            )
        );


        const pw =
        Math.min(
            cropW-px,
            Math.round(
                bwNorm *
                cropW
            )
        );


        const ph =
        Math.min(
            cropH-py,
            Math.round(
                bhNorm *
                cropH
            )
        );


        if(
            pw <= 5 ||
            ph <= 5
        )
            continue;


        const candidate = {

            x:
            sourceX + px,

            y:
            sourceY + py,

            w:
            pw,

            h:
            ph,

            score:
            score
        };


        if(
            !best ||
            score > best.score
        ){

            best =
            candidate;
        }
    }


    return best;
}


/* ==================================================
   اختيار أفضل مركبة
================================================== */

function vehicleCenter(vehicle){

    const[
        x,
        y,
        w,
        h
    ] =
    vehicle.bbox;


    return {

        x:
        x+w/2,

        y:
        y+h/2

    };
}


function distance(a,b){

    if(!a || !b)
        return Infinity;


    return Math.sqrt(

        Math.pow(
            a.x-b.x,
            2
        )

        +

        Math.pow(
            a.y-b.y,
            2
        )
    );
}


function chooseBestVehicle(
    vehicles
){

    if(
        !vehicles ||
        !vehicles.length
    )
        return null;


    /*
    محاولة الحفاظ على نفس السيارة
    */

    if(lockedVehicle){

        const oldCenter =
        vehicleCenter(
            lockedVehicle
        );


        let closest =
        null;


        let closestDistance =
        Infinity;


        vehicles.forEach(
            vehicle=>{

                const center =
                vehicleCenter(
                    vehicle
                );


                const d =
                distance(
                    oldCenter,
                    center
                );


                if(
                    d <
                    closestDistance &&
                    d <
                    300
                ){

                    closest =
                    vehicle;

                    closestDistance =
                    d;
                }

            }
        );


        if(closest){

            lockedVehicle =
            closest;

            lastVehicleCenter =
            vehicleCenter(
                closest
            );


            return closest;
        }
    }


    let candidates =
    vehicles.slice();


    /*
    فلترة النوع
    */

    if(
        targetData?.type
    ){

        if(
            targetData.type ===
            "car"
        ){

            candidates =
            candidates.filter(
                v =>
                v.class ===
                "car"
            );
        }


        if(
            targetData.type ===
            "truck"
        ){

            candidates =
            candidates.filter(
                v =>
                v.class ===
                "truck"
            );
        }


        if(
            targetData.type ===
            "bus"
        ){

            candidates =
            candidates.filter(
                v =>
                v.class ===
                "bus"
            );
        }
    }


    if(
        !candidates.length
    ){

        candidates =
        vehicles.slice();
    }


    const scored =
    candidates.map(
        vehicle=>{

            let score =
            vehicle.score *
            20;


            const area =
            vehicle.bbox[2] *
            vehicle.bbox[3];


            score +=
            Math.min(
                area/50000,
                10
            );


            if(
                targetData?.type &&
                (
                    targetData.type ===
                    vehicle.class
                    ||
                    (
                        targetData.type ===
                        "car" &&
                        vehicle.class ===
                        "car"
                    )
                )
            ){

                score += 30;
            }


            if(
                lastVehicleCenter
            ){

                const center =
                vehicleCenter(
                    vehicle
                );


                const d =
                distance(
                    center,
                    lastVehicleCenter
                );


                if(d < 80)
                    score += 20;

                else if(d < 160)
                    score += 12;

                else if(d < 250)
                    score += 5;
            }


            return {

                vehicle,
                score

            };
        }
    );


    scored.sort(
        (a,b)=>
        b.score-a.score
    );


    const best =
    scored[0]?.vehicle ||
    null;


    if(best){

        lockedVehicle =
        best;


        lastVehicleCenter =
        vehicleCenter(
            best
        );
    }


    return best;
}


/* ==================================================
   تكبير المركبة
================================================== */

function createZoom(
    x,
    y,
    w,
    h
){

    const padding =
    .25;


    const sx =
    Math.max(
        0,
        x-w*padding
    );


    const sy =
    Math.max(
        0,
        y-h*padding
    );


    const sw =
    Math.min(
        video.videoWidth-sx,
        w*(1+padding*2)
    );


    const sh =
    Math.min(
        video.videoHeight-sy,
        h*(1+padding*2)
    );


    const width =
    700;


    const height =
    Math.max(
        300,
        Math.round(
            width*sh/sw
        )
    );


    zoomCanvas.width =
    width;


    zoomCanvas.height =
    height;


    zoomCtx.imageSmoothingEnabled =
    true;


    zoomCtx.imageSmoothingQuality =
    "high";


    zoomCtx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        width,
        height
    );


    zoomBox.style.display =
    "block";
}


/* ==================================================
   OCR
================================================== */

async function readPlateOCR(
    x,
    y,
    w,
    h
){

    const source =
    document.createElement(
        "canvas"
    );


    const sctx =
    source.getContext("2d");


    const padding =
    .20;


    const sx =
    Math.max(
        0,
        x-w*padding
    );


    const sy =
    Math.max(
        0,
        y-h*padding
    );


    const sw =
    Math.min(
        video.videoWidth-sx,
        w*(1+padding*2)
    );


    const sh =
    Math.min(
        video.videoHeight-sy,
        h*(1+padding*2)
    );


    const scale =
    6;


    source.width =
    Math.min(
        1800,
        Math.max(
            300,
            Math.round(
                sw*scale
            )
        )
    );


    source.height =
    Math.min(
        700,
        Math.max(
            120,
            Math.round(
                sh*scale
            )
        )
    );


    sctx.imageSmoothingEnabled =
    true;


    sctx.imageSmoothingQuality =
    "high";


    sctx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        source.width,
        source.height
    );


    /*
    تنظيف وتحسين الصورة
    */

    const image =
    sctx.getImageData(
        0,
        0,
        source.width,
        source.height
    );


    for(
        let i=0;
        i<image.data.length;
        i+=4
    ){

        const r =
        image.data[i];


        const g =
        image.data[i+1];


        const b =
        image.data[i+2];


        const gray =
        0.299*r +
        0.587*g +
        0.114*b;


        const value =
        gray > 145
        ? 255
        : gray < 75
        ? 0
        : gray;


        image.data[i] =
        value;


        image.data[i+1] =
        value;


        image.data[i+2] =
        value;
    }


    sctx.putImageData(
        image,
        0,
        0
    );


    const ocr =
    await Tesseract.recognize(
        source,
        "eng",
        {

            tessedit_pageseg_mode:
            "7",

            preserve_interword_spaces:
            "1"
        }
    );


    return (
        ocr.data.text ||
        ""
    );
}


/* ==================================================
   تنظيف رقم اللوحة
================================================== */

function normalize(text){

    return String(
        text || ""
    )
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );
}
