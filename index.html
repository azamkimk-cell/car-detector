<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رصد المركبات</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h2{
    margin:10px;
}

#status{
    background:#222;
    padding:10px;
}

#viewer{
    position:relative;
    width:100%;
    height:70vh;
    background:#000;
    overflow:hidden;
}

video,canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    padding:14px 25px;
    margin:10px 5px;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.start{
    background:#1683ff;
    color:white;
}

.stop{
    background:#444;
    color:white;
}
</style>
</head>

<body>

<h2>🚗 رصد المركبات الذكي</h2>

<div id="status">
جاري تحميل النموذج...
</div>

<div id="viewer">

<video id="video"
       autoplay
       muted
       playsinline></video>

<canvas id="canvas"></canvas>

</div>

<button class="start" onclick="startCamera()">
تشغيل الكاميرا
</button>

<button class="stop" onclick="stopCamera()">
إيقاف
</button>

<script>

let model = null;
let running = false;
let detecting = false;

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

let audioCtx = null;
let lastAlert = 0;


/* الصوت */

function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

}

function beep(){

    const now = Date.now();

    if(now - lastAlert < 2000) return;

    lastAlert = now;

    if(!audioCtx) return;

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = 440;
    gain.gain.value = 0.04;

    osc.start();

    setTimeout(()=>{
        osc.stop();
    },100);

}


/* تحميل النموذج */

async function loadModel(){

    try{

        status.innerText =
        "جاري تحميل الذكاء الاصطناعي...";

        await tf.ready();

        model =
        await cocoSsd.load();

        status.innerText =
        "✅ النموذج جاهز";

    }catch(error){

        console.error(error);

        status.innerText =
        "❌ فشل تحميل النموذج";

    }

}


/* الكاميرا */

async function startCamera(){

    if(!model){

        alert(
        "انتظر حتى يصبح النموذج جاهزًا");

        return;

    }

    if(running) return;

    try{

        initAudio();

        if(audioCtx.state === "suspended"){
            await audioCtx.resume();
        }

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },
                width:{
                    ideal:960
                },
                height:{
                    ideal:540
                }
            },

            audio:false

        });

        video.srcObject =
        stream;

        running = true;

        status.innerText =
        "🟢 الكاميرا تعمل";

        video.onloadedmetadata =
        ()=>{

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;

            detect();

        };

    }catch(error){

        console.error(error);

        alert(
        "تعذر الوصول إلى الكاميرا");

    }

}


/* إيقاف */

function stopCamera(){

    running = false;

    detecting = false;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(track=>{
            track.stop();
        });

        video.srcObject = null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    status.innerText =
    "الكاميرا متوقفة";

}


/* الذكاء الاصطناعي */

async function detect(){

    if(!running) return;

    if(detecting){

        requestAnimationFrame(detect);
        return;

    }

    detecting = true;

    try{

        const predictions =
        await model.detect(video);

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );
