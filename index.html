<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مساعد رصد المركبات</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h2{
    margin:12px;
}

#container{
    position:relative;
    width:100%;
    height:70vh;
    background:#000;
    overflow:hidden;
}

video,canvas{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    left:0;
    top:0;
}

button{
    padding:14px 25px;
    margin:10px;
    border:0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.start{
    background:#1683ff;
    color:white;
}

.stop{
    background:#444;
    color:white;
}

#status{
    padding:10px;
    background:#222;
}
</style>
</head>

<body>

<h2>🚗 مساعد رصد المركبات</h2>

<div id="status">
جاري تحميل الذكاء الاصطناعي...
</div>

<div id="container">

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<canvas id="canvas"></canvas>

</div>

<button class="start" onclick="startCamera()">
تشغيل الكاميرا
</button>

<button class="stop" onclick="stopCamera()">
إيقاف
</button>

<script>

let model = null;
let running = false;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let audioContext = null;
let lastVehicleCount = 0;
let lastBeep = 0;


/* الصوت */

function initAudio(){

    if(!audioContext){

        audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

}


function beep(){

    if(!audioContext) return;

    const now = Date.now();

    if(now - lastBeep < 1500) return;

    lastBeep = now;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 440;
    gain.gain.value = 0.05;

    oscillator.start();

    setTimeout(()=>{
        oscillator.stop();
    },120);

}


/* تحميل النموذج */

async function loadModel(){

    try{

        status.innerText =
        "جاري تحميل نموذج السيارات...";

        if(typeof tf === "undefined"){

            throw new Error(
            "TensorFlow لم يتم تحميله");

        }

        await tf.ready();

        status.innerText =
        "جاري تحميل نموذج اكتشاف السيارات...";

        model = await cocoSsd.load();

        status.innerText =
        "✅ النموذج جاهز. اضغط تشغيل الكاميرا.";

    }
    catch(error){

        console.error(error);

        status.innerText =
        "❌ فشل تحميل نموذج الذكاء الاصطناعي. أعد تحميل الصفحة وتأكد من الإنترنت.";

    }

}


/* تشغيل الكاميرا */

async function startCamera(){

    if(!model){

        alert(
        "انتظر حتى ينتهي تحميل نموذج الذكاء الاصطناعي.");

        return;

    }

    try{

        initAudio();

        if(audioContext.state === "suspended"){
            await audioContext.resume();
        }

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:false

        });

        video.srcObject = stream;

        running = true;

        status.innerText =
        "🟢 الكاميرا تعمل — ابحث عن السيارات";

        video.onloadedmetadata = ()=>{

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;

            detect();

        };

    }
    catch(error){

        console.error(error);

        alert(
        "تعذر تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا.");

    }

}


/* إيقاف */

function stopCamera(){

    running = false;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(track=>track.stop());

        video.srcObject = null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    status.innerText =
    "الكاميرا متوقفة.";

}


/* اكتشاف السيارات */

async function detect(){

    if(!running || !model) return;

    try{

        const predictions =
        await model.detect(video);

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const vehicles =
        predictions.filter(p =>

            ["car","truck","bus"]
            .includes(p.class)

            && p.score >= 0.55

        );

        if(
            vehicles.length > 0 &&
            lastVehicleCount === 0
        ){

            beep();

        }

        lastVehicleCount =
        vehicles.length;


        vehicles.forEach(p=>{

            const [x,y,w,h] =
            p.bbox;

            ctx.strokeStyle =
            "#FFD700";

            ctx.lineWidth = 5;

            ctx.strokeRect(
                x,y,w,h
            );

            ctx.fillStyle =
            "#FFD700";

            ctx.font =
            "bold 22px Arial";

            const name =
            p.class === "car"
            ? "سيارة"
            : p.class === "truck"
            ? "شاحنة"
            : "حافلة";

            ctx.fillText(
                name,
                x,
                Math.max(25,y-8)
            );

        });

    }
    catch(error){

        console.error(error);

    }

    requestAnimationFrame(detect);

}


/* بدء تحميل النموذج */

loadModel();

</script>

</body>
</html>
