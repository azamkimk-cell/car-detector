<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رصد المركبات الذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h2{
    margin:10px;
}

#status{
    background:#222;
    padding:10px;
}

#viewer{
    position:relative;
    width:100%;
    height:62vh;
    background:#000;
    overflow:hidden;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#zoomBox{
    display:none;
    margin:10px auto;
    width:90%;
    max-width:500px;
    background:#000;
    border:3px solid #FFD700;
    border-radius:12px;
    overflow:hidden;
}

#zoomCanvas{
    width:100%;
    display:block;
}

button{
    padding:13px 20px;
    margin:7px 4px;
    border:0;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
}

.start{
    background:#1683ff;
    color:white;
}

.stop{
    background:#444;
    color:white;
}

.photo{
    background:#d89b00;
    color:white;
}
</style>
</head>

<body>

<h2>🚗 رصد المركبات الذكي</h2>

<div id="status">
جاري تحميل الذكاء الاصطناعي...
</div>

<div id="viewer">

<video id="video"
       autoplay
       muted
       playsinline></video>

<canvas id="canvas"></canvas>

</div>

<div id="zoomBox">

<div>🔎 التركيز على المركبة</div>

<canvas id="zoomCanvas"></canvas>

</div>

<button class="start" onclick="startCamera()">
تشغيل الكاميرا
</button>

<button class="stop" onclick="stopCamera()">
إيقاف
</button>

<button class="photo" onclick="takePhoto()">
📸 حفظ لقطة
</button>

<script>

let model = null;
let running = false;
let detecting = false;

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const zoomBox =
document.getElementById("zoomBox");

const zoomCanvas =
document.getElementById("zoomCanvas");

const zoomCtx =
zoomCanvas.getContext("2d");

const status =
document.getElementById("status");

let selectedVehicle = null;


/* تحميل النموذج */

async function loadModel(){

    try{

        status.innerText =
        "جاري تحميل نموذج اكتشاف السيارات...";

        await tf.ready();

        model =
        await cocoSsd.load();

        status.innerText =
        "✅ النموذج جاهز — شغّل الكاميرا";

    }catch(error){

        console.error(error);

        status.innerText =
        "❌ فشل تحميل النموذج";

    }

}


/* تشغيل الكاميرا */

async function startCamera(){

    if(!model){

        alert(
        "انتظر حتى يصبح النموذج جاهزًا");

        return;

    }

    if(running) return;

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },
                width:{
                    ideal:1280
                },
                height:{
                    ideal:720
                }
            },

            audio:false

        });

        video.srcObject =
        stream;

        running = true;

        status.innerText =
        "🟢 الكاميرا تعمل";

        video.onloadedmetadata =
        ()=>{

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;

            detect();

        };

    }catch(error){

        console.error(error);

        alert(
        "تعذر الوصول إلى الكاميرا");

    }

}


/* إيقاف الكاميرا */

function stopCamera(){

    running = false;

    detecting = false;

    selectedVehicle = null;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(track=>{
            track.stop();
        });

        video.srcObject = null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    zoomCtx.clearRect(
        0,
        0,
        zoomCanvas.width,
        zoomCanvas.height
    );

    zoomBox.style.display =
    "none";

    status.innerText =
    "الكاميرا متوقفة";

}


/* اكتشاف السيارات */

async function detect(){

    if(!running) return;

    if(detecting){

        setTimeout(detect,100);

        return;

    }

    detecting = true;

    try{

        const predictions =
        await model.detect(video);

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const vehicles =
        predictions.filter(p =>

            (
                p.class === "car" ||
                p.class === "truck" ||
                p.class === "bus"
            )

            && p.score >= 0.50

        );


        /*
        اختيار السيارة ذات أعلى
        درجة ثقة
        */

        selectedVehicle = null;

        if(vehicles.length > 0){

            selectedVehicle =
            vehicles.reduce(
                (best,current)=>
                current.score >
                best.score
                ? current
                : best
            );

        }


        /*
        رسم جميع السيارات بشكل
        طبيعي بدون مربعات
        */

        vehicles.forEach(p=>{

            const [x,y,w,h] =
            p.bbox;

            /*
            فقط السيارة المختارة
            تحصل على المربع الأصفر
            */

            if(
                selectedVehicle &&
                p === selectedVehicle
            ){

                ctx.strokeStyle =
                "#FFD700";

                ctx.lineWidth = 5;

                ctx.strokeRect(
                    x,y,w,h
                );

                ctx.fillStyle =
                "#FFD700";

                ctx.font =
                "bold 20px Arial";

                ctx.fillText(
                    "🔎 مشتبه بها",
                    x,
                    Math.max(25,y-8)
                );

                createZoom(
                    x,y,w,h
                );

            }

        });

    }catch(error){

        console.error(error);

    }

    detecting = false;

    setTimeout(
        detect,
        150
    );

}


/* الزوم الذكي */

function createZoom(
    x,y,w,h
){

    if(w <= 0 || h <= 0)
        return;


    /*
    إضافة هامش حول السيارة
    */

    const padding = 0.20;

    let sx =
    Math.max(
        0,
        x - w * padding
    );

    let sy =
    Math.max(
        0,
        y - h * padding
    );

    let sw =
    Math.min(
        video.videoWidth - sx,
        w * (1 + padding * 2)
    );

    let sh =
    Math.min(
        video.videoHeight - sy,
        h * (1 + padding * 2)
    );


    /*
    حجم نافذة الزوم
    */

    const zoomWidth =
    640;

    const zoomHeight =
    Math.round(
        zoomWidth * sh / sw
    );

    zoomCanvas.width =
    zoomWidth;

    zoomCanvas.height =
    zoomHeight;


    zoomCtx.clearRect(
        0,
        0,
        zoomWidth,
        zoomHeight
    );


    zoomCtx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        zoomWidth,
        zoomHeight
    );


    zoomBox.style.display =
    "block";

}


/* حفظ لقطة */

function takePhoto(){

    if(!selectedVehicle){

        alert(
        "لم يتم اكتشاف مركبة حاليًا");

        return;

    }


    const link =
    document.createElement("a");

    link.download =
    "vehicle-test.png";

    link.href =
    zoomCanvas.toDataURL(
        "image/png"
    );

    link.click();

}


/* تشغيل */

loadModel();

</script>

</body>
</html>
