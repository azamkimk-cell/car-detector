<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>مساعد رصد المركبات الذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* =========================
   صفحة المواصفات
========================= */

#setupPage{
    min-height:100vh;
    background:#101010;
    padding:20px;
}

.setupTitle{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:20px 0 25px;
}

.setupCard{
    background:#1d1d1d;
    border-radius:15px;
    padding:18px;
    max-width:600px;
    margin:auto;
}

label{
    display:block;
    margin:14px 0 6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    font-size:17px;
    background:#fff;
    color:#111;
}

.saveBtn{
    width:100%;
    padding:15px;
    margin-top:22px;
    border:0;
    border-radius:10px;
    background:#1683ff;
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

.clearBtn{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#555;
    color:#fff;
    font-size:16px;
}

.setupInfo{
    margin-top:18px;
    padding:12px;
    background:#292929;
    border-radius:10px;
    line-height:1.7;
    font-size:14px;
}

/* =========================
   صفحة الكاميرا
========================= */

#cameraPage{
    display:none;
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.topBar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;

    padding:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.65);
}

.targetSummary{
    font-size:14px;
    font-weight:bold;
}

.editBtn{
    background:#1683ff;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:9px 12px;
    font-weight:bold;
}

.status{
    position:absolute;
    top:58px;
    right:10px;
    z-index:20;

    background:rgba(0,0,0,.7);
    border-radius:20px;
    padding:8px 12px;

    font-size:13px;
}

.result{
    position:absolute;
    bottom:15px;
    left:10px;
    right:10px;
    z-index:20;

    background:rgba(0,0,0,.75);
    border-radius:10px;
    padding:12px;

    text-align:center;
    font-weight:bold;
}

#zoomBox{
    display:none;

    position:absolute;

    left:5%;
    right:5%;
    bottom:70px;

    z-index:30;

    background:#000;

    border:4px solid #ffd700;

    border-radius:12px;

    overflow:hidden;
}

.zoomTitle{
    background:#222;
    padding:7px;
    text-align:center;
    font-weight:bold;
}

#zoomCanvas{
    width:100%;
    display:block;
}

.cameraButtons{
    position:absolute;
    bottom:65px;
    left:10px;
    z-index:40;

    display:flex;
    gap:8px;
}

.cameraBtn{
    border:0;
    border-radius:9px;
    padding:10px 13px;
    font-weight:bold;
    background:rgba(0,0,0,.75);
    color:#fff;
}

.red{
    color:#ff3030;
}

.yellow{
    color:#ffd700;
}

.green{
    color:#00ff66;
}

</style>
</head>

<body>


<!-- =========================
     صفحة المواصفات
========================= -->

<div id="setupPage">

    <div class="setupTitle">
        🎯 مواصفات المركبة المطلوبة
    </div>

    <div class="setupCard">

        <label>
            🔢 رقم اللوحة
        </label>

        <input
            id="targetPlate"
            type="text"
            placeholder="مثال: 1234"
        >


        <label>
            🎨 لون المركبة
        </label>

        <select id="targetColor">

            <option value="">
                أي لون
            </option>

            <option value="white">
                أبيض
            </option>

            <option value="black">
                أسود
            </option>

            <option value="red">
                أحمر
            </option>

            <option value="blue">
                أزرق
            </option>

            <option value="gray">
                رمادي
            </option>

            <option value="silver">
                فضي
            </option>

            <option value="yellow">
                أصفر
            </option>

        </select>


        <label>
            🚗 نوع المركبة
        </label>

        <select id="targetType">

            <option value="">
                أي نوع
            </option>

            <option value="car">
                سيارة
            </option>

            <option value="suv">
                🚙 جيب / SUV
            </option>

            <option value="truck">
                🚚 شاحنة
            </option>

            <option value="bus">
                🚌 حافلة
            </option>

        </select>


        <button
            class="saveBtn"
            onclick="saveAndStart()"
        >
            💾 حفظ المعلومات وبدء الكاميرا
        </button>


        <button
            class="clearBtn"
            onclick="clearTarget()"
        >
            🗑 مسح المعلومات
        </button>


        <div class="setupInfo">

            ℹ️ بعد حفظ المعلومات ستختفي هذه الصفحة
            وتظهر الكاميرا بشكل كامل تقريبًا.

            <br><br>

            يمكنك العودة لاحقًا بواسطة زر
            ⚙️ تعديل المواصفات.

        </div>

    </div>

</div>


<!-- =========================
     صفحة الكاميرا
========================= -->

<div id="cameraPage">

    <video
        id="video"
        autoplay
        muted
        playsinline
    ></video>

    <canvas id="canvas"></canvas>


    <div class="topBar">

        <div
            id="targetSummary"
            class="targetSummary"
        >
            🎯 الهدف: لا توجد مواصفات
        </div>

        <button
            class="editBtn"
            onclick="showSetup()"
        >
            ⚙️ تعديل
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        جاري تحميل النظام...
    </div>


    <div
        id="result"
        class="result"
    >
        انتظار الكاميرا
    </div>


    <div
        id="zoomBox"
    >

        <div class="zoomTitle">
            🔎 المركبة المرشحة
        </div>

        <canvas
            id="zoomCanvas"
        ></canvas>

    </div>


    <div class="cameraButtons">

        <button
            class="cameraBtn"
            onclick="saveZoom()"
        >
            📸 لقطة
        </button>

        <button
            class="cameraBtn"
            onclick="stopCamera()"
        >
            ■ إيقاف
        </button>

    </div>

</div>


<script>

/* =========================
   المتغيرات
========================= */

let model=null;

let running=false;

let detecting=false;

let selectedVehicle=null;

let ocrBusy=false;

let lastMatch=false;

let lastAlarm=0;

let audioCtx=null;


const video=
document.getElementById("video");

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const zoomCanvas=
document.getElementById("zoomCanvas");

const zoomCtx=
zoomCanvas.getContext("2d");

const setupPage=
document.getElementById("setupPage");

const cameraPage=
document.getElementById("cameraPage");

const status=
document.getElementById("status");

const result=
document.getElementById("result");

const zoomBox=
document.getElementById("zoomBox");

const targetSummary=
document.getElementById("targetSummary");


/* =========================
   حفظ المواصفات
========================= */

function saveTarget(){

    const data={

        plate:
        document
        .getElementById("targetPlate")
        .value
        .trim(),

        color:
        document
        .getElementById("targetColor")
        .value,

        type:
        document
        .getElementById("targetType")
        .value

    };

    localStorage.setItem(
        "vehicleTarget",
        JSON.stringify(data)
    );

    return data;
}


/* =========================
   تحميل المواصفات
========================= */

function loadTarget(){

    const saved=
    localStorage.getItem(
        "vehicleTarget"
    );

    if(!saved)
        return null;

    try{

        const data=
        JSON.parse(saved);

        document
        .getElementById("targetPlate")
        .value=
        data.plate || "";

        document
        .getElementById("targetColor")
        .value=
        data.color || "";

        document
        .getElementById("targetType")
        .value=
        data.type || "";

        return data;

    }catch(e){

        return null;

    }

}


/* =========================
   عرض ملخص الهدف
========================= */

function updateSummary(){

    const data=
    loadTarget();

    if(!data){

        targetSummary.innerText=
        "🎯 لا توجد مواصفات";

        return;

    }

    let text="🎯 الهدف: ";

    if(data.plate)
        text+=
        "لوحة "+data.plate;

    if(data.type){

        if(data.plate)
            text+=" | ";

        if(data.type==="car")
            text+="سيارة";

        if(data.type==="suv")
            text+="جيب / SUV";

        if(data.type==="truck")
            text+="شاحنة";

        if(data.type==="bus")
            text+="حافلة";

    }

    targetSummary.innerText=
    text;

}


/* =========================
   الانتقال للكاميرا
========================= */

async function saveAndStart(){

    const data=
    saveTarget();

    if(
        !data.plate &&
        !data.type &&
        !data.color
    ){

        alert(
        "أدخل مواصفة واحدة على الأقل"
        );

        return;

    }

    updateSummary();

    setupPage.style.display=
    "none";

    cameraPage.style.display=
    "block";

    await startCamera();

}


/* =========================
   العودة للمواصفات
========================= */

function showSetup(){

    stopCamera();

    cameraPage.style.display=
    "none";

    setupPage.style.display=
    "block";

    loadTarget();

}


/* =========================
   مسح الهدف
========================= */

function clearTarget(){

    localStorage.removeItem(
        "vehicleTarget"
    );

    document
    .getElementById("targetPlate")
    .value="";

    document
    .getElementById("targetColor")
    .value="";

    document
    .getElementById("targetType")
    .value="";

}


/* =========================
   الصوت
========================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

}


function alarm(){

    const now=
    Date.now();

    if(
        now-lastAlarm<3000
    )
        return;

    lastAlarm=now;

    if(!audioCtx)
        return;

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.frequency.value=
    900;

    gain.gain.value=
    0.35;

    osc.start();

    setTimeout(()=>{
        osc.frequency.value=
        650;
    },200);

    setTimeout(()=>{
        osc.stop();
    },650);

}


/* =========================
   تحميل الذكاء الاصطناعي
========================= */

async function loadAI(){

    try{

        status.innerText=
        "جاري تحميل نموذج المركبات...";

        await tf.ready();

        model=
        await cocoSsd.load();

        status.innerText=
        "✅ النظام جاهز";

    }catch(e){

        console.error(e);

        status.innerText=
        "❌ فشل تحميل النموذج";

    }

}


/* =========================
   الكاميرا
========================= */

async function startCamera(){

    if(!model){

        alert(
        "انتظر حتى يكتمل تحميل النظام"
        );

        return;

    }

    if(running)
        return;

    try{

        initAudio();

        if(
            audioCtx.state===
            "suspended"
        ){

            await audioCtx.resume();

        }


        const stream=
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });


        video.srcObject=
        stream;

        running=true;

        status.innerText=
        "🟢 المراقبة تعمل";

        video.onloadedmetadata=
        ()=>{

            canvas.width=
            video.videoWidth;

            canvas.height=
            video.videoHeight;

            detect();

        };

    }catch(e){

        console.error(e);

        alert(
        "تعذر تشغيل الكاميرا"
        );

    }

}


/* =========================
   إيقاف الكاميرا
========================= */

function stopCamera(){

    running=false;

    detecting=false;

    selectedVehicle=null;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        video.srcObject=null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    zoomBox.style.display=
    "none";

    result.innerText=
    "الكاميرا متوقفة";

}


/* =========================
   اكتشاف المركبات
========================= */

async function detect(){

    if(!running)
        return;

    if(detecting){

        setTimeout(
            detect,
            100
        );

        return;

    }

    detecting=true;

    try{

        const predictions=
        await model.detect(
            video,
            20,
            0.40
        );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const vehicles=
        predictions.filter(
            p=>
            (
                p.class==="car" ||
                p.class==="truck" ||
                p.class==="bus"
            )
            &&
            p.score>=0.40
        );


        selectedVehicle=
        chooseVehicle(
            vehicles
        );


        if(selectedVehicle){

            const[
                x,y,w,h
            ]=
            selectedVehicle.bbox;


            ctx.strokeStyle=
            lastMatch
            ? "#ff0000"
            : "#ffd700";


            ctx.lineWidth=6;


            ctx.strokeRect(
                x,y,w,h
            );


            ctx.fillStyle=
            lastMatch
            ? "#ff0000"
            : "#ffd700";


            ctx.font=
            "bold 22px Arial";


            ctx.fillText(
                lastMatch
                ? "🚨 مطابقة"
                : "🔎 فحص",
                x,
                Math.max(
                    25,
                    y-8
                )
            );


            createZoom(
                x,y,w,h
            );


            if(!ocrBusy){

                recognizePlate(
                    x,y,w,h
                );

            }

        }else{

            lastMatch=false;

            zoomBox.style.display=
            "none";

            result.innerText=
            "لا توجد مركبة مرشحة";

        }

    }catch(e){

        console.error(e);

    }


    detecting=false;

    setTimeout(
        detect,
        180
    );

}


/* =========================
   اختيار المركبة
========================= */

function chooseVehicle(
    vehicles
){

    if(
        vehicles.length===0
    )
        return null;


    const data=
    loadTarget();


    if(!data)
        return null;


    let candidates=
    vehicles;


    /*
    السيارة والجيب:
    كلاهما يعتمد حاليًا على
    فئة car في COCO-SSD.
    */

    if(
        data.type==="car" ||
        data.type==="suv"
    ){

        candidates=
        vehicles.filter(
            p=>
            p.class==="car"
        );

    }


    if(data.type==="truck"){

        candidates=
        vehicles.filter(
            p=>
            p.class==="truck"
        );

    }


    if(data.type==="bus"){

        candidates=
        vehicles.filter(
            p=>
            p.class==="bus"
        );

    }


    if(
        candidates.length===0
    )
        return null;


    /*
    نختار المركبة
    الأكبر والأوضح
    */

    return candidates.reduce(
        (best,current)=>{

            const bestArea=
            best.bbox[2]*
            best.bbox[3];

            const currentArea=
            current.bbox[2]*
            current.bbox[3];


            const bestValue=
            bestArea*
            best.score;


            const currentValue=
            currentArea*
            current.score;


            return
            currentValue>
            bestValue
            ? current
            : best;

        }
    );

}


/* =========================
   التكبير
========================= */

function createZoom(
    x,y,w,h
){

    const padding=
    0.25;


    const sx=
    Math.max(
        0,
        x-w*padding
    );


    const sy=
    Math.max(
        0,
        y-h*padding
    );


    const sw=
    Math.min(
        video.videoWidth-sx,
        w*(1+padding*2)
    );


    const sh=
    Math.min(
        video.videoHeight-sy,
        h*(1+padding*2)
    );


    const width=700;


    const height=
    Math.max(
        300,
        Math.round(
            width*sh/sw
        )
    );


    zoomCanvas.width=
    width;

    zoomCanvas.height=
    height;


    zoomCtx.imageSmoothingEnabled=
    true;


    zoomCtx.imageSmoothingQuality=
    "high";


    zoomCtx.drawImage(
        video,
        sx,sy,sw,sh,
        0,0,
        width,height
    );


    zoomBox.style.display=
    "block";

}


/* =========================
   قراءة اللوحة
========================= */

async function recognizePlate(
    x,y,w,h
){

    const data=
    loadTarget();


    const target=
    normalize(
        data?.plate || ""
    );


    if(!target)
        return;


    ocrBusy=true;


    try{

        const temp=
        document.createElement(
            "canvas"
        );


        const tc=
        temp.getContext("2d");


        const padding=
        0.10;


        const sx=
        Math.max(
            0,
            x-w*padding
        );


        const sy=
        Math.max(
            0,
            y-h*padding
        );


        const sw=
        Math.min(
            video.videoWidth-sx,
            w*(1+padding*2)
        );


        const sh=
        Math.min(
            video.videoHeight-sy,
            h*(1+padding*2)
        );


        const scale=3;


        temp.width=
        Math.min(
            1500,
            Math.round(
                sw*scale
            )
        );


        temp.height=
        Math.min(
            1000,
            Math.round(
                sh*scale
            )
        );


        tc.drawImage(
            video,
            sx,sy,sw,sh,
            0,0,
            temp.width,
            temp.height
        );


        result.innerText=
        "🔎 فحص المركبة وقراءة اللوحة...";


        const ocr=
        await Tesseract.recognize(
            temp,
            "eng",
            {
                tessedit_pageseg_mode:
                "11"
            }
        );


        const text=
        normalize(
            ocr.data.text
        );


        console.log(
            "OCR:",
            text
        );


        if(
            text.includes(target)
        ){

            lastMatch=true;


            result.innerHTML=
            '<span class="red">🚨 تطابق رقم اللوحة!</span>';


            alarm();

        }else{

            lastMatch=false;


            result.innerHTML=
            '<span class="yellow">🟨 مركبة قيد الفحص</span>';

        }

    }catch(e){

        console.error(e);

    }


    ocrBusy=false;

}


/* =========================
   تنظيف رقم اللوحة
========================= */

function normalize(text){

    return String(text||"")
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );

}


/* =========================
   حفظ اللقطة
========================= */

function saveZoom(){

    if(
        !selectedVehicle ||
        !zoomCanvas.width
    ){

        alert(
        "لا توجد مركبة مكبرة حاليًا"
        );

        return;

    }


    const link=
    document.createElement(
        "a"
    );


    link.download=
    "vehicle-"+Date.now()+".png";


    link.href=
    zoomCanvas.toDataURL(
        "image/png"
    );


    link.click();

}


/* =========================
   البداية
========================= */

loadTarget();

updateSummary();

loadAI();

</script>

</body>
</html>
