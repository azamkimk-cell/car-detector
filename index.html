<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رصد المركبات - التجربة الأولى</title>
    
    <!-- تحميل مكتبة TensorFlow.js ونموذج COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        :root {
            --samsung-blue: #034EA2;
            --bg-dark: #121212;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            background: #000;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid var(--samsung-blue);
        }
        #viewer-container {
            position: relative;
            flex-grow: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            padding: 20px;
            background: #1e1e1e;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        .btn-start { background: var(--samsung-blue); color: white; }
        .btn-stop { background: #333; color: white; }
        
        #status-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 5;
            border: 1px solid var(--samsung-blue);
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--samsung-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div>جاري تهيئة النظام الذكي...</div>
    </div>

    <div id="header">مساعد رصد المركبات التجريبي</div>

    <div id="viewer-container">
        <div id="status-overlay">الحالة: جاهز</div>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="startApp()">تشغيل الكاميرا</button>
        <button class="btn-stop" onclick="stopApp()">إيقاف</button>
    </div>

    <script>
        let model;
        let isRunning = false;
        let lastVehicleCount = 0;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusOverlay = document.getElementById('status-overlay');
        const loadingScreen = document.getElementById('loading-screen');

        // سياق الصوت (Web Audio API) لتوليد نغمة التنبيه
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 440; // نغمة هادئة
            gainNode.gain.value = 0.05; // صوت منخفض جداً
            
            oscillator.start();
            setTimeout(() => oscillator.stop(), 100);
        }

        // تحميل النموذج عند فتح الصفحة
        async function loadAIModel() {
            try {
                model = await cocoSsd.load();
                loadingScreen.style.display = 'none';
            } catch (error) {
                console.error(error);
                alert("خطأ في تحميل النموذج. تأكد من اتصالك بالإنترنت.");
            }
        }

        async function startApp() {
            if (isRunning) return;
            
            initAudio(); // تفعيل الصوت عند ضغط المستخدم

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment", // استخدام الكاميرا الخلفية
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                isRunning = true;
                statusOverlay.innerText = "الحالة: جاري الرصد...";
                
                video.onloadedmetadata = () => {
                    renderFrame();
                };
            } catch (err) {
                alert("لا يمكن الوصول للكاميرا. يرجى التأكد من تفعيل HTTPS وإعطاء الصلاحية.");
            }
        }

        function stopApp() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            statusOverlay.innerText = "الحالة: متوقف";
        }

        async function renderFrame() {
            if (!isRunning) return;

            // ضبط حجم اللوحة ليتناسب مع الفيديو
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // إجراء الفحص (Detection)
            const predictions = await model.detect(video);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // تصفية النتائج للمركبات فقط
            const vehicles = predictions.filter(p => 
                ['car', 'truck', 'bus'].includes(p.class)
            );

            // منطق التنبيه الصوتي (عند ظهور مركبة جديدة فقط)
            if (vehicles.length > lastVehicleCount) {
                playBeep();
            }
            lastVehicleCount = vehicles.length;

            // رسم الصناديق
            vehicles.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                
                // رسم الإطار الأصفر
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 6;
                ctx.strokeRect(x, y, width, height);

                // رسم خلفية النص
                ctx.fillStyle = "#FFD700";
                const text = prediction.class === 'car' ? 'سيارة' : 
                             prediction.class === 'truck' ? 'شاحنة' : 'حافلة';
                ctx.font = "bold 24px Arial";
                ctx.fillText(text, x, y > 30 ? y - 10 : 30);
            });

            requestAnimationFrame(renderFrame);
        }

        // بدء تحميل النموذج فوراً
        loadAIModel();
    </script>
</body>
</html>
