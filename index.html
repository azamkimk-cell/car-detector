<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>مساعد رصد المركبات</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#101010;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    padding:12px;
    text-align:center;
    background:#050505;
    font-size:20px;
    font-weight:bold;
}

.panel{
    background:#1c1c1c;
    padding:12px;
}

label{
    display:block;
    margin-top:8px;
    margin-bottom:4px;
}

input,select,button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    font-size:16px;
}

input,select{
    background:#fff;
    color:#111;
}

button{
    margin-top:10px;
    font-weight:bold;
}

.start{
    background:#1683ff;
    color:#fff;
}

.stop{
    background:#444;
    color:#fff;
}

.photo{
    background:#b88600;
    color:#fff;
}

#status{
    background:#252525;
    padding:9px;
    text-align:center;
    font-size:14px;
}

#viewer{
    position:relative;
    width:100%;
    height:55vh;
    background:#000;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#result{
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#zoomBox{
    display:none;
    margin:10px;
    border:4px solid #ffd700;
    border-radius:10px;
    overflow:hidden;
    background:#000;
}

#zoomTitle{
    background:#222;
    padding:7px;
    font-weight:bold;
}

#zoomCanvas{
    width:100%;
    display:block;
}

.green{
    color:#00ff66;
}

.yellow{
    color:#ffd700;
}

.red{
    color:#ff3333;
}
</style>
</head>

<body>

<div class="header">
🚗 مساعد رصد المركبات الذكي
</div>

<div class="panel">

<label>رقم اللوحة المطلوبة</label>

<input
    id="targetPlate"
    type="text"
    placeholder="مثال: 1234"
>

<label>لون المركبة</label>

<select id="targetColor">
    <option value="">أي لون</option>
    <option value="white">أبيض</option>
    <option value="black">أسود</option>
    <option value="red">أحمر</option>
    <option value="blue">أزرق</option>
    <option value="gray">رمادي</option>
    <option value="silver">فضي</option>
    <option value="yellow">أصفر</option>
</select>

<label>نوع المركبة</label>

<select id="targetType">
    <option value="">أي نوع</option>
    <option value="car">سيارة</option>
    <option value="truck">شاحنة</option>
    <option value="bus">حافلة</option>
</select>

<button
    class="start"
    onclick="startCamera()">
    ▶ تشغيل الكاميرا
</button>

<button
    class="stop"
    onclick="stopCamera()">
    ■ إيقاف
</button>

<button
    class="photo"
    onclick="saveZoom()">
    📸 حفظ لقطة المركبة
</button>

</div>

<div id="status">
جاري تحميل الذكاء الاصطناعي...
</div>

<div id="viewer">

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

</div>

<div id="result">
الحالة: انتظار
</div>

<div id="zoomBox">

<div id="zoomTitle">
🔎 المركبة المرشحة
</div>

<canvas id="zoomCanvas"></canvas>

</div>

<script>

let model = null;

let running = false;

let detecting = false;

let selectedVehicle = null;

let lastMatch = false;

let ocrBusy = false;

let audioCtx = null;

let lastAlarm = 0;

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const zoomCanvas =
document.getElementById("zoomCanvas");

const zoomCtx =
zoomCanvas.getContext("2d");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const zoomBox =
document.getElementById("zoomBox");


/* =========================
   تحميل النموذج
========================= */

async function loadAI(){

    try{

        status.innerText =
        "جاري تحميل نموذج المركبات...";

        await tf.ready();

        model =
        await cocoSsd.load();

        status.innerText =
        "✅ الذكاء الاصطناعي جاهز";

    }catch(e){

        console.error(e);

        status.innerText =
        "❌ فشل تحميل النموذج";

    }

}


/* =========================
   الصوت
========================= */

function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

}

function alarm(){

    const now =
    Date.now();

    if(now-lastAlarm < 2500)
        return;

    lastAlarm = now;

    if(!audioCtx)
        return;

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.frequency.value =
    900;

    gain.gain.value =
    0.35;

    osc.start();

    setTimeout(()=>{
        osc.frequency.value = 650;
    },180);

    setTimeout(()=>{
        osc.stop();
    },600);

}


/* =========================
   تشغيل الكاميرا
========================= */

async function startCamera(){

    if(!model){

        alert(
        "انتظر حتى يصبح الذكاء الاصطناعي جاهزًا"
        );

        return;

    }

    if(running)
        return;

    try{

        initAudio();

        if(audioCtx.state === "suspended"){
            await audioCtx.resume();
        }

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false

        });

        video.srcObject =
        stream;

        running = true;

        status.innerText =
        "🟢 الكاميرا تعمل";

        result.innerText =
        "الحالة: مراقبة المركبات";

        video.onloadedmetadata =
        ()=>{

            canvas.width =
            video.videoWidth;

            canvas.height =
            video.videoHeight;

            detect();

        };

    }catch(e){

        console.error(e);

        alert(
        "تعذر الوصول إلى الكاميرا"
        );

    }

}


/* =========================
   إيقاف
========================= */

function stopCamera(){

    running = false;

    detecting = false;

    selectedVehicle = null;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(track=>{
            track.stop();
        });

        video.srcObject = null;

    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    zoomCtx.clearRect(
        0,
        0,
        zoomCanvas.width,
        zoomCanvas.height
    );

    zoomBox.style.display =
    "none";

    result.innerText =
    "الحالة: متوقف";

}


/* =========================
   اكتشاف المركبات
========================= */

async function detect(){

    if(!running)
        return;

    if(detecting){

        setTimeout(
            detect,
            100
        );

        return;

    }

    detecting = true;

    try{

        const predictions =
        await model.detect(
            video,
            20,
            0.45
        );

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const vehicles =
        predictions.filter(
            p =>

            (
                p.class === "car" ||
                p.class === "truck" ||
                p.class === "bus"
            )

            &&
            p.score >= 0.45

        );


        /*
        لا نضع مربعات على
        السيارات العادية
        */

        selectedVehicle =
        chooseCandidate(
            vehicles
        );


        /*
        رسم السيارة المرشحة
        */

        if(selectedVehicle){

            const [x,y,w,h] =
            selectedVehicle.bbox;

            ctx.strokeStyle =
            lastMatch
            ? "#ff0000"
            : "#ffd700";

            ctx.lineWidth = 6;

            ctx.strokeRect(
                x,y,w,h
            );

            ctx.fillStyle =
            lastMatch
            ? "#ff0000"
            : "#ffd700";

            ctx.font =
            "bold 22px Arial";

            ctx.fillText(
                lastMatch
                ? "🚨 مطابقة"
                : "🔎 فحص",
                x,
                Math.max(
                    25,
                    y-8
                )
            );


            createZoom(
                x,y,w,h
            );


            /*
            قراءة اللوحة
            */

            if(!ocrBusy){

                recognizePlate(
                    x,y,w,h
                );

            }

        }else{

            lastMatch = false;

            zoomBox.style.display =
            "none";

            result.innerText =
            "الحالة: لا توجد مركبة مرشحة";

        }

    }catch(e){

        console.error(e);

    }

    detecting = false;

    setTimeout(
        detect,
        150
    );

}


/* =========================
   اختيار المركبة
========================= */

function chooseCandidate(
    vehicles
){

    if(
        vehicles.length === 0
    )
        return null;


    const wantedType =
    document.getElementById(
        "targetType"
    ).value;


    let candidates =
    vehicles;


    if(wantedType){

        candidates =
        vehicles.filter(
            p =>
            p.class === wantedType
        );

        if(
            candidates.length === 0
        ){

            return null;

        }

    }


    /*
    نختار المركبة
    الأكبر والأوضح
    */

    return candidates.reduce(
        (best,current)=>{

            const bestArea =
            best.bbox[2] *
            best.bbox[3];

            const currentArea =
            current.bbox[2] *
            current.bbox[3];

            const bestScore =
            bestArea *
            best.score;

            const currentScore =
            currentArea *
            current.score;

            return
            currentScore >
            bestScore
            ? current
            : best;

        }
    );

}


/* =========================
   الزوم
========================= */

function createZoom(
    x,y,w,h
){

    const padding =
    0.25;

    let sx =
    Math.max(
        0,
        x-w*padding
    );

    let sy =
    Math.max(
        0,
        y-h*padding
    );

    let sw =
    Math.min(
        video.videoWidth-sx,
        w*(1+padding*2)
    );

    let sh =
    Math.min(
        video.videoHeight-sy,
        h*(1+padding*2)
    );


    const outWidth =
    700;

    const outHeight =
    Math.max(
        300,
        Math.round(
            outWidth*sh/sw
        )
    );

    zoomCanvas.width =
    outWidth;

    zoomCanvas.height =
    outHeight;


    zoomCtx.clearRect(
        0,
        0,
        outWidth,
        outHeight
    );


    zoomCtx.imageSmoothingEnabled =
    true;

    zoomCtx.imageSmoothingQuality =
    "high";


    zoomCtx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        outWidth,
        outHeight
    );


    zoomBox.style.display =
    "block";

}


/* =========================
   OCR اللوحة
========================= */

async function recognizePlate(
    x,y,w,h
){

    const target =
    normalize(
        document.getElementById(
            "targetPlate"
        ).value
    );


    if(!target)
        return;


    ocrBusy = true;


    try{

        /*
        قص السيارة
        */

        const temp =
        document.createElement(
            "canvas"
        );

        const tc =
        temp.getContext(
            "2d"
        );


        const padding =
        0.15;


        const sx =
        Math.max(
            0,
            x-w*padding
        );

        const sy =
        Math.max(
            0,
            y-h*padding
        );

        const sw =
        Math.min(
            video.videoWidth-sx,
            w*(1+padding*2)
        );

        const sh =
        Math.min(
            video.videoHeight-sy,
            h*(1+padding*2)
        );


        temp.width =
        Math.min(
            1000,
            Math.round(sw*2)
        );

        temp.height =
        Math.min(
            700,
            Math.round(sh*2)
        );


        tc.drawImage(
            video,
            sx,
            sy,
            sw,
            sh,
            0,
            0,
            temp.width,
            temp.height
        );


        const resultOCR =
        await Tesseract.recognize(
            temp,
            "eng",
            {
                logger:
                m => {

                    if(
                        m.status ===
                        "recognizing text"
                    ){

                        result.innerText =
                        "🔎 محاولة قراءة اللوحة...";

                    }

                }
            }
        );


        const text =
        normalize(
            resultOCR.data.text
        );


        if(
            text &&
            text.includes(target)
        ){

            lastMatch = true;

            result.innerHTML =
            '<span class="red">🚨 تطابق! المركبة مطابقة</span>';

            alarm();

        }else{

            lastMatch = false;

            result.innerHTML =
            '<span class="yellow">🟨 مركبة قيد الفحص — لم يحدث تطابق</span>';

        }

    }catch(e){

        console.error(e);

    }


    ocrBusy = false;

}


/* =========================
   تنظيف النص
========================= */

function normalize(text){

    return String(text || "")
    .toUpperCase()
    .replace(
        /[^A-Z0-9]/g,
        ""
    );

}


/* =========================
   حفظ لقطة
========================= */

function saveZoom(){

    if(
        !selectedVehicle ||
        !zoomCanvas.width
    ){

        alert(
        "لا توجد مركبة مكبرة حاليًا"
        );

        return;

    }


    const link =
    document.createElement(
        "a"
    );

    link.download =
    "vehicle-test.png";

    link.href =
    zoomCanvas.toDataURL(
        "image/png"
    );

    link.click();

}


/* =========================
   بدء البرنامج
========================= */

loadAI();

</script>

</body>
</html>
